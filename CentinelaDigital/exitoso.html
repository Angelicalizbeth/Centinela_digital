<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reporte enviado</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f8f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }


        .mensaje {
            background: white;
            width: 400px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 0px 15px #ccc;
        }


        h1 {
            color: #2e8b57;
        }


        p {
            font-size: 18px;
            color: #444;
        }


        .icono {
            font-size: 60px;
        }


        button {
            margin-top: 20px;
            background-color: #2e8b57;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }


        button:hover {
            background-color: #246b43;
        }

    </style>

</head>


<body>

    <div class="mensaje">

        <div class="icono">
            ✅
        </div>

        <h1>
            ¡Reporte enviado correctamente!
        </h1>

        <p>
            Tu reporte ha sido registrado con éxito.
            Gracias por ayudar a crear una comunidad más segura.
        </p>


        <button onclick="window.location.href='/'">
            Volver al inicio
        </button>


    </div>


</body>

</html>
